name: Release macOS Binary

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release-macos:
    name: Build universal binary & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          lipo -create \
            .build/arm64-apple-macosx/release/danger-swift \
            .build/x86_64-apple-macosx/release/danger-swift \
            -output .build/release/danger-swift
          lipo -info .build/release/danger-swift

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARBALL="danger-swift-macos-universal.tar.gz"
          tar -czf "$TARBALL" -C .build/release danger-swift
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
