# This is a basic workflow to help you get started with Actions

name: Create Release

# Controls when the workflow will run
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v2

      - name: Export tag version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Create release
        run: ./Scripts/release_changelog.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    name: Build universal binary & publish
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary and library (arm64 + x86_64)
        run: |
          sed -i '' 's/\.library(name: "Danger", targets: \["Danger"\])/.library(name: "Danger", type: .dynamic, targets: ["Danger"])/' Package.swift
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          mkdir -p .build/universal/lib/danger
          lipo -create \
            .build/arm64-apple-macosx/release/danger-swift \
            .build/x86_64-apple-macosx/release/danger-swift \
            -output .build/universal/danger-swift
          lipo -create \
            .build/arm64-apple-macosx/release/libDanger.dylib \
            .build/x86_64-apple-macosx/release/libDanger.dylib \
            -output .build/universal/lib/danger/libDanger.dylib
          lipo -info .build/universal/danger-swift
          # Swift modules are architecture specific; ship the arm64 ones alongside the universal dylib
          cp -R .build/arm64-apple-macosx/release/Modules/. .build/universal/lib/danger/ 2>/dev/null || true
          cp -R .build/arm64-apple-macosx/release/*.swiftmodule .build/arm64-apple-macosx/release/*.swiftdoc .build/universal/lib/danger/ 2>/dev/null || true

      - name: Package binary
        run: |
          TARBALL="danger-swift-macos-universal.tar.gz"
          tar -czf "$TARBALL" -C .build/universal danger-swift lib
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
